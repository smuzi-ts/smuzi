<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Logs</title>
    <link rel="stylesheet" href="{{base}}/assets/app.css">
    <script defer src="{{base}}/assets/app.js"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased">
<div x-data="logsViewer" data-api="{{base}}/api/logs" data-logout="{{base}}/api/logout" data-login="{{base}}/login" class="mx-auto max-w-6xl space-y-4 p-4">

    <header class="flex items-center gap-3">
        <h1 class="text-xl font-semibold">Logs</h1>
        <span class="text-sm text-slate-500" x-cloak>
            <span x-text="total"></span> groups
        </span>
        <span x-show="loading" x-cloak class="text-sm text-slate-400">loading…</span>
        <button type="button" @click="load()"
                class="ml-auto rounded-md border border-slate-300 bg-white px-3 py-1.5 text-sm hover:bg-slate-100">
            Refresh
        </button>
        <button type="button" @click="logout()"
                class="rounded-md border border-slate-300 bg-white px-3 py-1.5 text-sm hover:bg-slate-100">
            Log out
        </button>
    </header>

    <section class="flex flex-col gap-3 rounded-lg border border-slate-200 bg-white p-4 shadow-sm">
        <form @submit.prevent="search()" class="flex flex-wrap items-end gap-3">
            <label class="flex min-w-[12rem] flex-1 flex-col gap-1">
                <span class="text-xs font-medium text-slate-600">Trace ID</span>
                <input x-model="trace_id" type="search" placeholder="exact match"
                       class="rounded-md border border-slate-300 px-3 py-1.5 font-mono text-sm focus:border-sky-500 focus:outline-none">
            </label>

            <label class="flex min-w-[12rem] flex-1 flex-col gap-1">
                <span class="text-xs font-medium text-slate-600">Message</span>
                <input x-model="message" type="search" placeholder="contains…"
                       class="rounded-md border border-slate-300 px-3 py-1.5 font-mono text-sm focus:border-sky-500 focus:outline-none">
            </label>

            <button type="submit"
                    class="rounded-md bg-sky-600 px-4 py-1.5 text-sm font-medium text-white hover:bg-sky-700">
                Search
            </button>
        </form>

        <div class="flex flex-col gap-1">
            <span class="text-xs font-medium text-slate-600">Tags</span>
            <button type="button" @click="openTagModal()"
                    class="flex w-fit items-center gap-2 rounded-md border border-slate-300 bg-white px-3 py-1.5 text-sm hover:bg-slate-100">
                Filter by tags
                <span x-show="tags.length > 0" x-cloak
                      class="rounded-full bg-sky-100 px-1.5 py-0.5 text-xs font-medium text-sky-800"
                      x-text="tags.length"></span>
            </button>
        </div>

        <div x-show="hasFilters()" x-cloak class="flex flex-wrap items-center gap-2">
            <template x-if="trace_id.trim() !== ''">
                <span class="inline-flex items-center gap-1 rounded-full bg-violet-100 py-0.5 pl-3 pr-1 font-mono text-xs text-violet-800">
                    trace_id=<span x-text="trace_id"></span>
                    <button type="button" title="Remove" @click="trace_id = ''; search()"
                            class="h-5 w-5 rounded-full leading-none hover:bg-violet-200">−</button>
                </span>
            </template>
            <template x-if="message.trim() !== ''">
                <span class="inline-flex items-center gap-1 rounded-full bg-amber-100 py-0.5 pl-3 pr-1 font-mono text-xs text-amber-800">
                    message~<span x-text="message"></span>
                    <button type="button" title="Remove" @click="message = ''; search()"
                            class="h-5 w-5 rounded-full leading-none hover:bg-amber-200">−</button>
                </span>
            </template>
            <template x-for="(tag, index) in tags" :key="tag.key + '=' + tag.value">
                <span class="inline-flex items-center gap-1 rounded-full bg-sky-100 py-0.5 pl-3 pr-1 font-mono text-xs text-sky-800">
                    <span x-text="tag.key"></span>=<span x-text="tag.value === '' ? '*' : tag.value"></span>
                    <button type="button" title="Remove tag filter" @click="removeTag(index)"
                            class="h-5 w-5 rounded-full leading-none hover:bg-sky-200">−</button>
                </span>
            </template>
            <button type="button" @click="clearFilters()" class="text-xs text-slate-500 underline hover:text-slate-800">
                clear all
            </button>
        </div>
    </section>

    <div x-show="tag_modal_open" x-cloak
         class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 p-4"
         @keydown.escape.window="closeTagModal()">
        <div @click.outside="closeTagModal()"
             class="w-full max-w-lg space-y-4 rounded-lg bg-white p-5 shadow-lg">
            <div class="flex items-center justify-between">
                <h2 class="text-base font-semibold">Filter by tags</h2>
                <button type="button" title="Close" @click="closeTagModal()"
                        class="text-slate-400 hover:text-slate-700">✕</button>
            </div>

            <div class="space-y-2">
                <div x-show="tag_draft.length > 0" x-cloak
                     class="flex gap-2 text-xs font-medium text-slate-500">
                    <span class="w-40">Tag name</span>
                    <span class="flex-1">Value contains</span>
                    <span class="w-10"></span>
                </div>
                <template x-for="(tag, index) in tag_draft" :key="index">
                    <div class="flex gap-2">
                        <input x-model="tag.key" aria-label="Tag name" placeholder="e.g. route"
                               class="w-40 rounded-md border border-slate-300 px-3 py-1.5 font-mono text-sm focus:border-sky-500 focus:outline-none">
                        <input x-model="tag.value" aria-label="Value contains" placeholder="empty = field exists"
                               class="flex-1 rounded-md border border-slate-300 px-3 py-1.5 font-mono text-sm focus:border-sky-500 focus:outline-none">
                        <button type="button" title="Remove tag" @click="removeDraftTag(index)"
                                class="w-10 rounded-md border border-slate-300 text-lg leading-none hover:bg-slate-100">
                            −
                        </button>
                    </div>
                </template>

                <button type="button" @click="addDraftTag()" class="text-sm text-sky-700 hover:underline">
                    + Add tag
                </button>
            </div>

            <div class="flex justify-end gap-2 border-t border-slate-100 pt-3">
                <button type="button" @click="closeTagModal()"
                        class="rounded-md border border-slate-300 bg-white px-4 py-1.5 text-sm hover:bg-slate-100">
                    Cancel
                </button>
                <button type="button" @click="applyTagModal()"
                        class="rounded-md bg-sky-600 px-4 py-1.5 text-sm font-medium text-white hover:bg-sky-700">
                    Apply
                </button>
            </div>
        </div>
    </div>

    <div x-show="error_message !== ''" x-cloak
         class="rounded-lg border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-800"
         x-text="error_message"></div>

    <div x-show="!loading && error_message === '' && groups.length === 0" x-cloak
         class="rounded-lg border border-dashed border-slate-300 p-8 text-center text-sm text-slate-500">
        No logs found
    </div>

    <div class="space-y-2">
        <template x-for="group in groups" :key="groupKey(group)">
            <article class="overflow-hidden rounded-lg border border-slate-200 bg-white shadow-sm">
                <header @click="toggle(group)"
                        class="flex cursor-pointer select-none items-center gap-3 px-4 py-2 hover:bg-slate-50">
                    <span class="w-3 text-slate-400" x-text="isExpanded(group) ? '▾' : '▸'"></span>
                    <span class="rounded px-1.5 py-0.5 text-xs font-medium ring-1 ring-inset"
                          :class="levelBadge(group.level)" x-text="levelName(group.level)"></span>
                    <template x-if="group.trace_id !== null">
                        <button type="button" title="Filter by this trace_id" @click.stop="filterByTrace(group.trace_id)"
                                class="truncate font-mono text-sm text-violet-700 hover:underline"
                                x-text="group.trace_id"></button>
                    </template>
                    <template x-if="group.trace_id === null">
                        <span class="text-sm italic text-slate-400">no trace_id</span>
                    </template>
                    <span class="shrink-0 text-xs text-slate-500" x-text="group.logs.length + (group.logs.length === 1 ? ' log' : ' logs')"></span>
                    <span class="shrink-0 text-xs text-slate-400" x-text="formatDuration(group)"></span>
                    <time class="ml-auto shrink-0 font-mono text-xs text-slate-500" x-text="formatDate(group.finished_at)"></time>
                </header>

                <p x-show="!isExpanded(group)" class="truncate px-4 pb-2 pl-10 font-mono text-xs text-slate-600"
                   x-text="summary(group)"></p>

                <ol x-show="isExpanded(group)" class="divide-y divide-slate-100 border-t border-slate-100">
                    <template x-for="log in group.logs" :key="log.id">
                        <li class="grid grid-cols-[6.5rem_3.5rem_1fr] gap-3 px-4 py-2">
                            <time class="pt-0.5 font-mono text-xs text-slate-500" :title="log.created_at"
                                  x-text="formatTime(log.created_at)"></time>
                            <span>
                                <span class="rounded px-1.5 py-0.5 text-xs font-medium ring-1 ring-inset"
                                      :class="levelBadge(log.level)" x-text="levelName(log.level)"></span>
                            </span>
                            <div class="min-w-0 space-y-1">
                                <div class="flex flex-wrap gap-1">
                                    <template x-for="tag in tagEntries(log.tags)" :key="tag.key">
                                        <button type="button" title="Add to filter"
                                                @click="filterByTag(tag.key, tag.value)"
                                                class="rounded bg-slate-100 px-1.5 py-0.5 font-mono text-[11px] text-slate-600 hover:bg-sky-100 hover:text-sky-800">
                                            <span x-text="tag.key"></span>=<span x-text="String(tag.value)"></span>
                                        </button>
                                    </template>
                                </div>
                                <pre class="whitespace-pre-wrap break-words font-mono text-xs text-slate-800"
                                     x-text="formatMessage(log.message)"></pre>
                            </div>
                        </li>
                    </template>
                </ol>
            </article>
        </template>
    </div>

    <footer x-show="total > 0" x-cloak class="flex items-center justify-between text-sm text-slate-600">
        <span><span x-text="pageRange()"></span> of <span x-text="total"></span></span>
        <div class="flex gap-2">
            <button type="button" @click="prevPage()" :disabled="!hasPrevPage() || loading"
                    class="rounded-md border border-slate-300 bg-white px-3 py-1.5 hover:bg-slate-100 disabled:opacity-40">
                ← Prev
            </button>
            <button type="button" @click="nextPage()" :disabled="!hasNextPage() || loading"
                    class="rounded-md border border-slate-300 bg-white px-3 py-1.5 hover:bg-slate-100 disabled:opacity-40">
                Next →
            </button>
        </div>
    </footer>
</div>
</body>
</html>
