<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Zoho-OAuth-Init</title>
</head>
<body>
<form action="get_auth_code" method="POST">
    <div>
        Client ID: <input type="text" name="clientId">
    </div>
    <div>
        Client Secret: <input type="text" name="clientSecret">
    </div>

    <div>
        Domain:
    </div>
    <select name="domain">
    @for(domain of domains)
      <option value="{{ domain }}">{{ domain }}</option>
    @end
    </select>


    <div>
        Scopes:
    </div>
    @for(scope of scopes)
        <div><input type="checkbox" name="scopes" value="{{ scope }}"> {{scope}}</div>
    @end
    <input type="submit" value="Generate">
</form>

</body>
</html>
